name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client install --no-audit --no-fund

      - name: Run all tests
        run: npm test
